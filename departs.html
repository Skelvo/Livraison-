<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tableau des départs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0c0c">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Écran télé : toutes les tailles suivent la taille de l'écran (vh / vw),
   pour rester lisible de loin quelle que soit la télé. */
:root {
  --bg: #0e0c0c;
  --surface: #1a1616;
  --surface2: #221e1e;
  --border: #332a2a;
  --red: #e84040;
  --orange: #f59020;
  --green: #40d490;
  --text: #f2eeee;
  --muted: #8a7878;
  --u: min(1vh, 0.5625vw); /* 1 unité = 1 % de la hauteur d'un écran 16:9 */
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;
  overflow:hidden; cursor:none;
}
.screen {
  height:100vh; display:grid; grid-template-rows:auto 1fr auto auto;
  padding:calc(var(--u)*3) calc(var(--u)*4); gap:calc(var(--u)*2.5);
}

/* ── BARRE DU HAUT ── */
.top { display:flex; align-items:baseline; justify-content:space-between; }
.top-title { font-family:'Bebas Neue',sans-serif; font-size:calc(var(--u)*5); letter-spacing:.15em; color:var(--muted); }
.top-date { font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.6); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
.top-left { display:flex; align-items:center; gap:calc(var(--u)*2.5); }
/* Retour à l'app : indispensable quand la page est ouverte depuis l'icône de l'écran d'accueil */
.back {
  font-family:'DM Mono',monospace; font-size:max(14px, calc(var(--u)*2.4)); letter-spacing:.1em;
  color:var(--muted); text-decoration:none; white-space:nowrap; cursor:pointer;
  border:1px solid var(--border); border-radius:8px; padding:max(8px, calc(var(--u)*1)) max(12px, calc(var(--u)*1.8));
}
.back:hover { color:var(--text); border-color:var(--muted); }
/* Livreurs Bellecave : au dépôt (vert) / en tournée (orange) */
.drivers { display:flex; flex-wrap:wrap; justify-content:center; gap:calc(var(--u)*1) calc(var(--u)*2.4); align-self:center; flex:1; padding:0 calc(var(--u)*2); }
.drv { font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.4); white-space:nowrap; display:flex; align-items:center; gap:calc(var(--u)*1); }
.drv .pill { font-size:calc(var(--u)*2.4); padding:calc(var(--u)*.3) calc(var(--u)*1.4); }
.drv.arrive { color:var(--green); } .drv.parti { color:var(--orange); } .drv.none { color:var(--muted); }
.top-clock { font-family:'DM Mono',monospace; font-size:calc(var(--u)*6); font-weight:500; }

/* ── CORPS : prochain départ à gauche, suivants à droite ── */
.main { display:grid; grid-template-columns:42fr 58fr; gap:calc(var(--u)*3); min-height:0; }

.label {
  font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.4); letter-spacing:.3em;
  color:var(--muted); text-transform:uppercase;
}

.next {
  background:var(--surface); border:calc(var(--u)*.4) solid var(--border); border-radius:calc(var(--u)*2.5);
  padding:calc(var(--u)*3.5); display:flex; flex-direction:column; justify-content:space-between; min-height:0;
}
.next.soon { border-color:var(--orange); }
.next.urgent { border-color:var(--red); animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{background:var(--surface)} 50%{background:#3a1414} }
.next-time { font-family:'Bebas Neue',sans-serif; font-size:calc(var(--u)*22); line-height:.85; letter-spacing:.02em; }
.next-who { display:flex; flex-direction:column; gap:calc(var(--u)*1.5); align-items:flex-start; }
.next-who .pill { font-size:calc(var(--u)*4.8); padding:calc(var(--u)*.8) calc(var(--u)*2.6); }
.next-cd { font-family:'Bebas Neue',sans-serif; font-size:calc(var(--u)*11); line-height:1; color:var(--green); }
.next.soon .next-cd { color:var(--orange); }
.next.urgent .next-cd { color:var(--red); }
.next-done { font-family:'Bebas Neue',sans-serif; font-size:calc(var(--u)*11); line-height:1; }
.next-sub { font-size:calc(var(--u)*3.2); color:var(--muted); }

/* ── LISTE DES DÉPARTS SUIVANTS ── */
.list { display:flex; flex-direction:column; min-height:0; }
.list .label { margin-bottom:calc(var(--u)*1.5); }
.rows { display:flex; flex-direction:column; gap:calc(var(--u)*1.2); overflow:hidden; flex:1; }
.row {
  display:grid; grid-template-columns:calc(var(--u)*17) 1fr auto; align-items:center; gap:calc(var(--u)*2.5);
  background:var(--surface); border:calc(var(--u)*.3) solid var(--border); border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*1.2) calc(var(--u)*2.5); flex-shrink:0;
}
.row-time { font-family:'Bebas Neue',sans-serif; font-size:calc(var(--u)*7.5); line-height:1; }
.row-who { display:flex; flex-wrap:wrap; gap:calc(var(--u)*1); }
.row .pill { font-size:calc(var(--u)*3.6); padding:calc(var(--u)*.5) calc(var(--u)*2); }
.more { font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.6); color:var(--muted); padding-left:calc(var(--u)*1); flex-shrink:0; }
.row-cd { font-family:'DM Mono',monospace; font-size:calc(var(--u)*4); font-weight:500; color:var(--green); white-space:nowrap; }
.row.soon { border-color:var(--orange); }
.row.soon .row-cd { color:var(--orange); }
.row.urgent { border-color:var(--red); }
.row.urgent .row-cd { color:var(--red); }
.empty { font-size:calc(var(--u)*3.5); color:var(--muted); }

/* ── TRANSPORTEURS ── */
.pill { display:inline-block; font-weight:700; border-radius:999px; white-space:nowrap; border:calc(var(--u)*.25) solid; }
.pill-serge   { background:#3d1a18; color:#f07060; border-color:#5a2820; }
.pill-lande   { background:#18263d; color:#6090f0; border-color:#20386a; }
.pill-pb      { background:#18301f; color:#50d080; border-color:#205030; }
.pill-bearn   { background:#3d2c10; color:#d09040; border-color:#5a4020; }
.pill-hendaye { background:#2c1a3d; color:#9060e0; border-color:#40286a; }
.pill-ace     { background:#2a2a2a; color:#d0d0d0; border-color:#555; }

/* ── RETARDS / ANNULATIONS ── */
.late { color:var(--orange); font-weight:700; }
.prep { color:var(--text); font-weight:700; }
.pill .late { font-size:.85em; }
.pill.cancelled { text-decoration:line-through; opacity:.7; }
.row.cancelled { border-color:rgba(232,64,64,.5); }
.row.cancelled .row-time { text-decoration:line-through; color:var(--muted); }
.row.cancelled .row-cd { color:var(--red); font-weight:700; letter-spacing:.1em; }

/* ── BANDEAU : garages du prochain départ, qui défilent ── */
.ticker {
  display:flex; align-items:center; gap:calc(var(--u)*2); overflow:hidden; min-height:calc(var(--u)*6);
  background:var(--surface); border:calc(var(--u)*.3) solid var(--border); border-radius:calc(var(--u)*1.5);
  padding:0 0 0 calc(var(--u)*2.5);
}
.ticker:empty { display:none; }
.ticker-label {
  flex-shrink:0; font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.4); letter-spacing:.2em;
  color:var(--muted); text-transform:uppercase; white-space:nowrap;
}
.ticker-track {
  flex:1; overflow:hidden; white-space:nowrap;
  -webkit-mask-image:linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
          mask-image:linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
}
.ticker-move { display:inline-block; animation:defile linear infinite; will-change:transform; }
.ticker-move span { font-size:calc(var(--u)*3.4); font-weight:600; padding:0 calc(var(--u)*1.6); }
.ticker-move span::after { content:'·'; color:var(--muted); padding-left:calc(var(--u)*3.2); }
@keyframes defile { from { transform:translateX(0); } to { transform:translateX(-50%); } }

/* ── BAS : départs déjà partis ── */
.past {
  -webkit-mask-image:linear-gradient(to right, #000 85%, transparent);
          mask-image:linear-gradient(to right, #000 85%, transparent);
  display:flex; align-items:center; gap:calc(var(--u)*2); flex-wrap:nowrap; overflow:hidden;
  font-family:'DM Mono',monospace; font-size:calc(var(--u)*2.4); color:var(--muted); white-space:nowrap;
}
.past-item { opacity:.7; text-decoration:line-through; }

/* Écran en portrait (téléphone, télé tournée) : on empile */
@media (orientation:portrait) {
  :root { --u: min(0.6vh, 1vw); }
  body { overflow:auto; cursor:auto; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .screen { height:auto; min-height:100vh; }
  .main { grid-template-columns:1fr; }
  .top { align-items:center; gap:12px; }
  .top-title { font-size:calc(var(--u)*4); }
  .top-clock { font-size:calc(var(--u)*4.5); }
  .top { flex-wrap:wrap; }
  .drivers { order:3; flex-basis:100%; justify-content:flex-start; padding:0; }
  .next { gap:calc(var(--u)*3); }
  .rows { overflow:visible; }
  .past { flex-wrap:wrap; white-space:normal; }
}
</style>
</head>
<body>
<div class="screen">

  <div class="top">
    <div class="top-left">
      <a class="back" href="./" aria-label="Retour à l'accueil">← Accueil</a>
      <div>
      <div class="top-title">Départs du jour</div>
      <div class="top-date" id="date"></div>
      </div>
    </div>
    <div class="drivers" id="drivers"></div>
    <div class="top-clock" id="clock">--:--:--</div>
  </div>

  <div class="main">
    <div class="next" id="next"></div>
    <div class="list">
      <div class="label">Ensuite</div>
      <div class="rows" id="rows"></div>
    </div>
  </div>

  <div class="ticker" id="ticker"></div>

  <div class="past" id="past"></div>

</div>

<script src="data.js"></script>
<script src="live.js"></script>
<script>
// Garages ajoutés ou modifiés depuis l'admin (même base que index.html)
const SUPA_URL = 'https://aitbhskkwoqmoqfpogph.supabase.co';
const SUPA_KEY = 'sb_publishable_84rSs3LwBpdWs4qbPd5zkA_dOh-ci4s';

async function loadGaragesFromSupabase() {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/garages?select=name,carriers', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) return;
    try { localStorage.setItem('garages_cache', JSON.stringify(data)); } catch(e) {}
    applyGarageRows(data);
    render();
  } catch(e) { console.log('Supabase error:', e); }
}

// La base contient tous les garages : elle remplace la liste de data.js
function applyGarageRows(data){
  const list = data.map(function(row){
    let carriers = [];
    try { carriers = JSON.parse(row.carriers) || []; } catch(e) {}
    return LIVE.fixGarage({ g: row.name, carriers: carriers });
  });
  GARAGES_DATA.length = 0;
  list.forEach(function(g){ GARAGES_DATA.push(g); });
}
try { const cached = JSON.parse(localStorage.getItem('garages_cache') || 'null'); if(cached && cached.length) applyGarageRows(cached); } catch(e) {}

// Helpers
function parseTime(s){ const p = s.split('h'); return parseInt(p[0])*60 + parseInt(p[1]||0); }
function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function fmtCD(diff){
  if(diff < 60) return 'dans ' + diff + ' min';
  return 'dans ' + Math.floor(diff/60) + 'h' + String(diff%60).padStart(2,'0');
}
function pill(cid, delay){
  return '<span class="pill pill-' + cid + '">' + CARRIERS[cid].label + (delay ? ' <b class="late">+' + delay + '</b>' : '') + '</span>';
}
function pillOf(d){ return d.cancelled ? '<span class="pill pill-' + d.cid + ' cancelled">' + CARRIERS[d.cid].label + '</span>' : pill(d.cid, d.delay); }
function urgency(diff){ return diff <= 15 ? 'urgent' : diff <= 30 ? 'soon' : ''; }
function plural(n, w){ return n + ' ' + w + (n > 1 ? 's' : ''); }

function garagesFor(cid, time){
  return GARAGES_DATA.filter(function(g){
    return g.carriers.some(function(c){ return c.id === cid && c.deps.indexOf(time) !== -1; });
  }).map(function(g){ return g.g; });
}
function garageCount(cid, time){ return garagesFor(cid, time).length; }

// Bandeau qui fait défiler les garages du prochain départ.
// On ne le reconstruit que si la liste change, sinon le défilement repartirait de zéro chaque minute.
let tickerKey = '';
function renderTicker(time, names){
  const el = document.getElementById('ticker');
  const key = time + '|' + names.join('|');
  if(key === tickerKey) return;
  tickerKey = key;
  if(!names.length){ el.innerHTML = ''; return; }
  const items = names.map(function(n){ return '<span>' + esc(n) + '</span>'; }).join('');
  el.innerHTML = '<div class="ticker-label">Garages du ' + time + '</div>' +
    '<div class="ticker-track"><div class="ticker-move">' + items + items + '</div></div>';
  // Vitesse constante quelle que soit la longueur de la liste (~4 s par garage)
  el.querySelector('.ticker-move').style.animationDuration = Math.max(20, names.length * 4) + 's';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// Tous les départs de la journée, triés par heure réelle (retards compris).
// time = heure prévue (celle des garages), t = heure réelle en minutes, show = heure réelle affichée
function allDepartures(){
  const list = [];
  Object.keys(CARRIER_DEPS).forEach(function(cid){
    CARRIER_DEPS[cid].forEach(function(time){
      const eff = LIVE.effMin(cid, time);
      const t = eff === null ? parseTime(time) : eff;
      list.push({ cid: cid, time: time, t: t, show: LIVE.fmt(t), cancelled: eff === null, delay: eff === null ? 0 : eff - parseTime(time) });
    });
  });
  return list.sort(function(a,b){ return a.t - b.t || CARRIERS[a.cid].label.localeCompare(CARRIERS[b.cid].label); });
}

function renderDrivers(){
  const st = LIVE.driverStatus();
  document.getElementById('drivers').innerHTML = LIVE.bellecave().filter(function(r){ return r.active || st[r.id]; }).map(function(r){
    const d = st[r.id];
    const cls = d ? d.status : 'none';
    const txt = !d ? '—' : (d.status === 'parti' ? '🚚 parti ' : '🏠 au dépôt ') + LIVE.hhmm(d.at);
    return '<div class="drv ' + cls + '"><span class="pill pill-' + r.id + '">' + r.label + '</span>' + txt + '</div>';
  }).join('');
}

function render(){
  renderDrivers();
  const now = nowMin();
  const deps = allDepartures();
  // Les annulés restent affichés (barrés) jusqu'à leur heure prévue, mais ne comptent jamais comme « prochain départ »
  const upcoming = deps.filter(function(d){ return d.t > now; });
  const past = deps.filter(function(d){ return d.t <= now && !d.cancelled; });

  // Prochain départ : tous les transporteurs qui partent à la même heure
  const nextEl = document.getElementById('next');
  const active = upcoming.filter(function(d){ return !d.cancelled; });
  if(active.length){
    const first = active.filter(function(d){ return d.t === active[0].t; });
    const diff = first[0].t - now;
    const nb = first.reduce(function(s, d){ return s + garageCount(d.cid, d.time); }, 0);
    nextEl.className = 'next ' + urgency(diff);
    nextEl.innerHTML =
      '<div class="label">Prochain départ</div>' +
      '<div class="next-time">' + first[0].show + '</div>' +
      '<div class="next-who">' + first.map(function(d){ return pill(d.cid, d.delay); }).join('') + '</div>' +
      '<div><div class="next-cd">' + fmtCD(diff) + '</div>' +
      '<div class="next-sub">' + plural(nb, 'garage') +
        first.filter(function(d){ return d.delay; }).map(function(d){ return ' · <span class="late">retard ' + d.delay + ' min (prévu ' + d.time + ')</span>'; }).join('') +
        (LIVE.prepMinutes() ? ' · <span class="prep">📦 à préparer avant ' + LIVE.fmt(first[0].t - LIVE.prepMinutes()) + '</span>' : '') +
      '</div></div>';
    const names = [];
    first.forEach(function(d){ garagesFor(d.cid, d.time).forEach(function(n){ if(names.indexOf(n) === -1) names.push(n); }); });
    renderTicker(first[0].show, names.sort(function(a,b){ return a.localeCompare(b); }));
    first.forEach(function(d){ upcoming.splice(upcoming.indexOf(d), 1); });
    upcoming.sort(function(a, b){ return a.t - b.t; });
  } else {
    renderTicker('', []);
    nextEl.className = 'next';
    nextEl.innerHTML =
      '<div class="label">Prochain départ</div>' +
      '<div class="next-done">Plus de départ aujourd’hui</div>' +
      (deps.length ? '<div class="next-sub">Demain : ' + deps.slice().sort(function(a,b){ return parseTime(a.time) - parseTime(b.time); })[0].time + '</div>' : '');
  }

  // Une ligne par heure, avec tous les transporteurs qui partent à cette heure-là
  const groups = [];
  upcoming.forEach(function(d){
    const last = groups[groups.length - 1];
    if(last && last.t === d.t && last.cancelled === d.cancelled) last.items.push(d);
    else groups.push({ t: d.t, show: d.show, cancelled: d.cancelled, items: [d] });
  });
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = groups.length
    ? groups.map(function(g){
        const diff = g.t - now;
        return '<div class="row ' + (g.cancelled ? 'cancelled' : urgency(diff)) + '">' +
          '<div class="row-time">' + g.show + '</div>' +
          '<div class="row-who">' + g.items.map(pillOf).join('') + '</div>' +
          '<div class="row-cd">' + (g.cancelled ? 'ANNULÉ' : fmtCD(diff)) + '</div>' +
        '</div>';
      }).join('')
    : '<div class="empty">Rien d’autre aujourd’hui.</div>';
  fitRows(rowsEl);

  // Les plus récents d'abord : si la ligne est trop longue, ce sont les plus anciens qui sont coupés
  document.getElementById('past').innerHTML = past.length
    ? '<span>Déjà partis :</span>' + past.slice().reverse().map(function(d){
        return '<span class="past-item">' + d.show + ' ' + CARRIERS[d.cid].label + '</span>';
      }).join('')
    : '';
}

// Sur la télé, on n'affiche que les lignes qui tiennent en entier
function fitRows(el){
  if(getComputedStyle(el).overflow !== 'hidden') return;
  const rows = Array.prototype.slice.call(el.querySelectorAll('.row'));
  const bottom = el.getBoundingClientRect().bottom;
  let hidden = 0;
  rows.forEach(function(r){
    if(r.getBoundingClientRect().bottom > bottom + 1){ r.remove(); hidden++; }
  });
  if(hidden){
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = '+ ' + hidden + ' autre' + (hidden > 1 ? 's' : '') + ' plus tard';
    el.appendChild(more);
    const kept = el.querySelectorAll('.row');
    if(more.getBoundingClientRect().bottom > bottom + 1 && kept.length){
      kept[kept.length - 1].remove();
      more.textContent = '+ ' + (hidden + 1) + ' autres plus tard';
    }
  }
}
window.addEventListener('resize', render);

function renderClock(){
  const n = new Date();
  document.getElementById('clock').textContent =
    [n.getHours(), n.getMinutes(), n.getSeconds()].map(function(v){ return String(v).padStart(2,'0'); }).join(':');
  document.getElementById('date').textContent =
    n.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

// Re-rendu à chaque changement de minute
let lastMin = -1;
setInterval(function(){
  renderClock();
  const m = nowMin();
  if(m !== lastMin){ lastMin = m; render(); }
}, 1000);

// La télé reste allumée toute la journée : on recharge les garages de l'admin régulièrement
setInterval(loadGaragesFromSupabase, 10 * 60 * 1000);

// Horaires et retards modifiés dans l'admin : vérifiés chaque minute
setInterval(function(){ LIVE.refresh().then(function(changed){ if(changed) render(); }); }, 60000);
// Copie de la page pour qu'elle reste affichée même si le réseau coupe
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

renderClock();
render();
LIVE.refresh().then(function(){ render(); });
loadGaragesFromSupabase();
</script>
</body>
</html>
